<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyayabooth - Web Photo Booth</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CSS External -->
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  
  <!-- QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center p-4 md:p-8">

  <!-- Header -->
  <header class="text-center mb-6 pt-2">
    <h1 class="brand-title text-4xl md:text-6xl text-pink-500 drop-shadow-md leading-relaxed">Tyayabooth</h1>
    <p class="text-slate-600 font-medium mt-1">Ayo abadikan momen manismu di sini! ✨</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Area Kamera & Control (Kiri) -->
    <div class="lg:col-span-2 flex flex-col items-center">
      <div class="glass-card p-4 rounded-3xl shadow-xl w-full flex flex-col items-center relative">
        
        <!-- Live Webcam View -->
        <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover -scale-x-100"></video>
          
          <!-- Countdown Overlay -->
          <div id="countdown-overlay" class="absolute inset-0 bg-black/40 hidden flex items-center justify-center z-10">
            <span id="countdown-text" class="text-8xl font-black text-white animate-ping">3</span>
          </div>

          <!-- Flash Kamera -->
          <div id="flash-effect" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-150 z-20"></div>
        </div>

        <!-- Pilihan Frame/Theme -->
        <div class="w-full mt-4">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Pilih Frame Favorite Kamu:</label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-2 md:gap-3" id="frame-selector">
            <button onclick="selectFrame('cute-pink')" class="frame-btn border-2 border-pink-400 bg-pink-50 hover:bg-pink-100 p-2 rounded-xl text-xs font-bold text-pink-600 flex flex-col items-center gap-1 transition">
              <span class="w-4 h-4 rounded-full bg-pink-400"></span> Cute Pink
            </button>
            <button onclick="selectFrame('classic-white')" class="frame-btn border-2 border-slate-200 bg-white hover:bg-slate-50 p-2 rounded-xl text-xs font-bold text-slate-700 flex flex-col items-center gap-1 transition">
              <span class="w-4 h-4 rounded-full bg-slate-300"></span> Classic White
            </button>
            <button onclick="selectFrame('retro-black')" class="frame-btn border-2 border-slate-700 bg-slate-900 hover:bg-slate-800 p-2 rounded-xl text-xs font-bold text-white flex flex-col items-center gap-1 transition">
              <span class="w-4 h-4 rounded-full bg-slate-700"></span> Retro Dark
            </button>
            <button onclick="selectFrame('train-ticket')" class="frame-btn border-2 border-amber-800 bg-amber-50 hover:bg-amber-100 p-2 rounded-xl text-xs font-bold text-amber-900 flex flex-col items-center gap-1 transition">
              <span class="w-4 h-4 rounded-full bg-amber-800"></span> Train Ticket 🚂
            </button>
            <button onclick="selectFrame('denim-y2k')" class="frame-btn border-2 border-indigo-600 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-xl text-xs font-bold text-indigo-700 flex flex-col items-center gap-1 transition">
              <span class="w-4 h-4 rounded-full bg-indigo-600"></span> Denim Y2K 👖
            </button>
            <button onclick="selectFrame('slank-rock')" class="frame-btn border-2 border-zinc-700 bg-zinc-900 hover:bg-zinc-800 p-2 rounded-xl text-xs font-bold text-zinc-100 flex flex-col items-center gap-1 transition">
              <span class="w-4 h-4 rounded-full bg-red-600"></span> Slank Official ✌️
            </button>
          </div>
        </div>

        <!-- Tombol Capture -->
        <div class="mt-6 w-full">
          <button id="btn-snap" onclick="startPhotoProcess()" class="w-full bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg hover:shadow-pink-300/50 transition transform active:scale-95 text-center text-lg">
            📸 Mulai Foto (3 Jepretan)
          </button>
        </div>
      </div>
    </div>

    <!-- Area Preview & Export (Kanan) -->
    <div class="flex flex-col items-center w-full">
      <div class="glass-card p-4 rounded-3xl shadow-xl w-full flex flex-col items-center min-h-[400px]">
        <h2 class="font-bold text-lg text-slate-700 mb-3">Hasil Photo Strip 🎞️</h2>
        
        <!-- Canvas Tersembunyi -->
        <canvas id="photo-strip-canvas" class="hidden"></canvas>
        
        <!-- Container Preview -->
        <div id="preview-container" class="w-48 min-h-[300px] border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center p-2 text-center text-slate-400">
          <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span class="text-xs">Foto kamu akan muncul di sini</span>
        </div>

        <!-- Tombol Aksi -->
        <div id="result-actions" class="w-full mt-4 flex flex-col items-center gap-3 hidden">
          <a id="download-link" download="tyayabooth-strip.png" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl text-center text-sm transition">
            ⬇️ Download Foto
          </a>
          
          <button id="btn-upload" onclick="uploadToFirebase()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-4 rounded-xl text-center text-sm transition">
            ☁️ Upload & Buat QR Code
          </button>

          <div id="qr-box" class="flex flex-col items-center p-3 bg-white rounded-xl shadow-inner border border-slate-100 hidden w-full">
            <p class="text-xs font-semibold text-slate-600 mb-2">Scan untuk download di HP:</p>
            <div id="qrcode" class="p-1"></div>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- JS External -->
  <script src="script.js"></script>
</body>
</html>
